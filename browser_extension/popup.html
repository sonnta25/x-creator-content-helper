<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Content Bot Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>X Content Bot Bridge <span id="version"></span></h1>

      <label>
        Bridge URL
        <input id="bridgeUrl" spellcheck="false">
      </label>

      <label>
        Token
        <input id="token" spellcheck="false">
      </label>

      <label>
        Timeout seconds
        <input id="timeoutSeconds" type="number" min="30" step="30">
      </label>

      <label>
        Poll seconds
        <input id="pollSeconds" type="number" min="30" step="30">
      </label>

      <div class="toggle-row">
        <span>Auto Run</span>
        <button id="autoRun" class="toggle" type="button" aria-pressed="false">OFF</button>
      </div>

      <section>
        <h2>Scheduled approvals</h2>

        <div class="toggle-row">
          <span>Automation</span>
          <button id="automationEnabled" class="toggle" type="button" aria-pressed="false">OFF</button>
        </div>

        <div class="two-columns">
          <label>
            Active from
            <input id="activeStart" type="time">
          </label>
          <label>
            Active until
            <input id="activeEnd" type="time">
          </label>
        </div>

        <label>
          /replytargets interval + max post age (minutes)
          <input id="replyTargetsMinutes" type="number" min="5" step="1">
        </label>
        <p id="replyScheduleStatus" class="hint"></p>

        <label>
          /replytargets query (optional)
          <input id="replyTargetsQuery" spellcheck="false" placeholder="blank = auto">
        </label>

        <label>
          /tweettrend3 fixed times
          <input id="trendTimes" spellcheck="false" placeholder="09:00, 18:30">
        </label>

        <label>
          /tweettrend3 category
          <select id="trendCategory">
            <option value="auto">auto</option>
            <option value="trending">trending</option>
            <option value="news">news</option>
            <option value="sport">sport</option>
            <option value="entertainment">entertainment</option>
          </select>
        </label>

        <p class="hint">Send <code>/automationhere</code> once in the Telegram chat that should receive approvals.</p>
      </section>

      <div class="actions">
        <button id="save">Save</button>
        <button id="run">Run next job</button>
        <button id="diagnoseGemini" type="button">Diagnose Gemini DOM</button>
      </div>

      <pre id="status">Ready.</pre>
    </main>

    <script src="popup.js"></script>
  </body>
</html>

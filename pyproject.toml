[project]
name = "x-telegram-content-bot"
version = "0.1.0"
description = "Telegram bot that finds high-opportunity X conversations and drafts standout replies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=21.8,<23",
    "twscrape>=0.19.2,<1",
    "yt-dlp[default]>=2025.1,<2027",
    "gallery-dl>=1.29,<2",
    "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
